<!-- Paste into EmailJS: Email Templates > Create > Code editor.
     Settings tab: To Email = receiver's address, Subject = SHE SAID YES 💗, Reply To = {{reply_to}} -->
<div style="font-family:Arial,Helvetica,sans-serif;max-width:520px;margin:0 auto;background:#ffffff;border:1px solid #eadff7;border-radius:20px;overflow:hidden;">
  <div style="background:#2b86c5;border-bottom:6px solid #f6b3d0;padding:28px 20px;text-align:center;">
    <div style="font-size:26px;font-weight:bold;color:#ffffff;">💗 SHE SAID YES!</div>
    <div style="color:#ffffff;margin-top:6px;">{{gf_name}} said yes to a date with {{sister_name}}</div>
    <div style="color:#ffffff;margin-top:6px;">OUR 3RD ANNIVERSARY DATE</div>
    <div style="color:#ffffff;font-size:18px;font-weight:bold;">{{anniversary_date}}</div>
  </div>
  <div style="padding:20px;">
    <!-- Triple braces = HTML is not escaped (built safely in script.js) -->
    {{{choices_html}}}
    <hr style="border:none;border-top:1px dashed #cdbff0;margin:22px 0;">
    <div style="font-size:12px;letter-spacing:1px;font-weight:bold;color:#4aa6dc;">💌 A LITTLE MESSAGE FOR YOU</div>
    <!-- Double braces = HTML-escaped, so her message stays exactly as typed -->
    <div style="font-size:16px;color:#3b3358;white-space:pre-wrap;margin-top:8px;">{{message}}</div>
    <p style="font-size:14px;color:#6b6385;margin-top:22px;">From:<br><strong>{{guest_name}}</strong></p>
  </div>
</div>
